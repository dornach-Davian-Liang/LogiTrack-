# Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=logitrack-backend

# Email AI Automation Process Manager
emailai.python.executable=C:\\Python314\\python.exe
emailai.working.dir=C:\\Users\\Administrator\\Desktop\\email-ai-automation
emailai.main.script=main.py
emailai.monitor.api.url=http://127.0.0.1:5100

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=ldf123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate Configuration
# 使用 update 模式，允许 Hibernate 自动调整表结构
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL 特定配置
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS Configuration (Allow frontend to access backend)
# This is configured in the code for better control

# Logging
logging.level.com.logitrack=DEBUG
logging.level.com.logitrack.backend.aspect=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# File upload size limits (if needed in the future)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 邮件发送配置 (数据质检报告)
# 注意: MAIL_USERNAME/MAIL_PASSWORD 未配置时，JavaMailSender 不会创建，
#       系统自动降级为通过 Python Graph API (emailai.monitor.api.url) 发送。
# ==========================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 发件人地址（显示名称）
quality.mail.from=${MAIL_FROM:noreply-logitrack@zieglergroup.cn}
# 应用访问地址（邮件中用于说明查询入口）
app.base-url=${APP_BASE_URL:http://localhost:3000}

# ==========================================
# Spring 调度线程池
# ==========================================
spring.task.scheduling.pool.size=2

